<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main gradient -->
    <linearGradient id="gradMain" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#bfdbfe" />
      <stop offset="0.5" stop-color="#e9d5ff" />
      <stop offset="1" stop-color="#fbcfe8" />
    </linearGradient>
    <!-- Shadow gradient -->
    <linearGradient id="gradShadow" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="rgba(0,0,0,0.15)" />
      <stop offset="1" stop-color="rgba(0,0,0,0)" />
    </linearGradient>
  </defs>

  <!-- Folder back -->
  <path d="M8 20 h48 a4 4 0 0 1 4 4 v28 a4 4 0 0 1 -4 4 h-48 a4 4 0 0 1 -4 -4 v-28 a4 4 0 0 1 4 -4 z"
        fill="url(#gradMain)" />

  <!-- Folder tab -->
  <path d="M8 16 h16 l4 4 h28 a4 4 0 0 1 4 4 v4 h-56 v-8 a4 4 0 0 1 4 -4 z"
        fill="url(#gradMain)" />

  <!-- Folder shadow -->
  <path d="M8 20 h48 a4 4 0 0 1 4 4 v28 a4 4 0 0 1 -4 4 h-48 a4 4 0 0 1 -4 -4 v-28 a4 4 0 0 1 4 -4 z"
        fill="url(#gradShadow)" />

  <!-- Project windows inside -->
  <rect x="16" y="28" width="12" height="10" rx="2" fill="white" opacity="0.9"/>
  <rect x="30" y="28" width="12" height="10" rx="2" fill="white" opacity="0.9"/>
  <rect x="16" y="40" width="26" height="10" rx="2" fill="white" opacity="0.9"/>
</svg>
